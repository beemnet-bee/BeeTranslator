        theme: {
          extend: {
            fontFamily: {

    <style>
      body {
        color: #F0F0F0; /* text-primary */
        background-color: #0D1120; /* primary-dark */
      }
      .aurora-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }
      .aurora-background::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background: 
          radial-gradient(circle at 20% 20%, #3a0ca3, transparent 40%),
          radial-gradient(circle at 80% 30%, #00F5D4, transparent 40%),
          radial-gradient(circle at 50% 80%, #f72585, transparent 40%);
        animation: rotate-aurora 30s linear infinite;
        filter: blur(100px);
        opacity: 0.5;
      }

      @keyframes rotate-aurora {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      /* Splash Screen */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0D1120;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        opacity: 1;
        visibility: visible;
      }
      body.loading #root {
        display: none;
      }
      body:not(.loading) #splash-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        animation: splash-fade-in 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .splash-icon {
        animation: splash-pulse 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }
      
      @keyframes splash-fade-in {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 245, 212, 0.3)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(0, 245, 212, 0.6));}
      }

      /* Loading dots for splash screen */
      .loading-dots span {
        animation-name: blink-dots;
        animation-duration: 1.4s;
        animation-iteration-count: infinite;
        animation-fill-mode: both;
        display: inline-block;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: .2s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: .4s;
      }
      @keyframes blink-dots {
        0%, 80%, 100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }

      /* Custom Scrollbar - Beautified & Modern */
      /* For Webkit browsers (Chrome, Safari) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background-color: rgba(26, 30, 51, 0.1); /* secondary-dark/10% - more subtle */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(0, 245, 212, 0.7), rgba(58, 12, 163, 0.7)); /* Glassy gradient */
        border-radius: 4px;
        transition: all 0.2s ease-in-out;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #00F5D4, #3a0ca3); /* Opaque gradient */
        box-shadow: 0 0 12px rgba(0, 245, 212, 0.5);
      }
      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(58, 12, 163, 0.7) rgba(26, 30, 51, 0.1);
      }

      /* Entry Animations */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      
      /* Typing effect */
      .blinking-cursor {
        display: inline-block;
        width: 3px;
        height: 1.2em;
        background-color: #00F5D4; /* accent */
        animation: blink 1s step-end infinite;
        vertical-align: bottom;
        margin-left: 2px;
        border-radius: 1px;
      }
      @keyframes blink {
        from, to { background-color: transparent; }
        50% { background-color: #00F5D4; }
      }
      
      /* New Component Animations */
      @keyframes ripple {
        from { transform: scale(0); opacity: 0.75; }
        to { transform: scale(1.5); opacity: 0; }
      }
      .animate-ripple {
        animation: ripple 0.6s ease-out forwards;
      }
      
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 12px rgba(0, 245, 212, 0.4); }
        50% { box-shadow: 0 0 20px rgba(0, 245, 212, 0.7); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite;
      }

      /* Modal Animations */
      @keyframes modal-swoop-in {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal-swoop-in {
        animation: modal-swoop-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes modal-fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .animate-modal-fade-out {
        animation: modal-fade-out 0.2s ease-out forwards;
      }
    </style>
